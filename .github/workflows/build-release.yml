name: Build Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_only:
        description: Build the current version without publishing a Release
        type: boolean
        default: false

concurrency:
  group: build-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  RELEASE_MATRIX: '{"include":[{"target":"android-arm64","runner":"ubuntu-26.04","shell":"bash","platform":"android","arch":"arm64","abi":"arm64-v8a"}]}'

jobs:
  prepare:
    name: Check release metadata
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
      version: ${{ steps.meta.outputs.version }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read application metadata and version history
        run: python .github/scripts/release_source.py --github-event

      - name: Check metadata and print release notes
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
        run: |
          extra=()
          if [ "$BUILD_ONLY" = true ]; then extra=(--build-only); fi
          python .github/scripts/release_ci.py prepare --channel release --changelog-mode versioned "${extra[@]}"

      - name: Save release plan
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-plan-${{ github.run_id }}
          path: build/ci/plan/
          if-no-files-found: error
          overwrite: true

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_ABI: ${{ matrix.abi }}
      TARGET_ID: ${{ matrix.target }}
      C001APK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      C001APK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      C001APK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      EXPECTED_CERTIFICATE: ${{ secrets.SIGNING_CERT_SHA256 }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download release plan
        uses: actions/download-artifact@v8
        with:
          name: release-plan-${{ github.run_id }}
          path: build/ci/plan/

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install explicit Android SDK packages
        run: sdkmanager 'platforms;android-34' 'platforms;android-35' 'platforms;android-37.1' 'build-tools;36.0.0'

      - name: Set up Gradle dependencies
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Prepare signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64" && test -n "$EXPECTED_CERTIFICATE"
          test -n "$C001APK_KEYSTORE_PASSWORD" && test -n "$C001APK_KEY_ALIAS" && test -n "$C001APK_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/c001apk-signing.jks"
          chmod 600 "$RUNNER_TEMP/c001apk-signing.jks"
          echo "C001APK_KEYSTORE_PATH=$RUNNER_TEMP/c001apk-signing.jks" >> "$GITHUB_ENV"

      - name: Prepare and check build inputs
        run: |
          set -euo pipefail
          python scripts/prebuild.py
          python .github/scripts/release_package.py check-environment

      - name: Run release validation
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tools -p 'test_*.py'
          python scripts/build.py gradle --jobs 2 :app:testDebugUnitTest :media-support:testDebugUnitTest :image-viewer:testDebugUnitTest :app:lintDebug

      - name: Build signed Release APK
        run: |
          set -euo pipefail
          test "$TARGET_PLATFORM" = android && test "$TARGET_ARCH" = arm64 && test "$TARGET_ABI" = arm64-v8a
          python scripts/build.py build-apk --build-type release --require-release-signing --app-version "$APP_VERSION" --update-repository "$GITHUB_REPOSITORY" --jobs 2

      - name: Verify APK and package release files
        run: python .github/scripts/release_package.py package

      - name: Check release packages
        run: python .github/scripts/release_ci.py check-artifacts --target "$TARGET_ID"

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.target }}
          path: build/ci/packages/${{ matrix.target }}/*
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish_release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download release plan
        uses: actions/download-artifact@v8
        with:
          name: release-plan-${{ github.run_id }}
          path: build/ci/plan/

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: build/ci/artifacts/
          merge-multiple: false

      - name: Create tag and publish verified packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release_ci.py publish
