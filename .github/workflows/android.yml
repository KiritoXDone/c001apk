name: Android
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        options: [release, debug, release-no-r8]
        default: release
      app_version:
        description: Semantic app version
        default: '1.5.0'
        type: string
  workflow_call:
    inputs:
      variant:
        type: string
        default: debug
      app_version:
        type: string
        default: '1.5.0'
      source_ref:
        description: Git ref to build; defaults to the workflow ref
        type: string
        default: ''
    secrets:
      KEYSTORE_BASE64: { required: false }
      KEYSTORE_PASSWORD: { required: false }
      KEY_ALIAS: { required: false }
      KEY_PASSWORD: { required: false }
      SIGNING_CERT_SHA256: { required: false }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_VARIANT: ${{ inputs.variant || 'debug' }}
      APP_VERSION: ${{ inputs.app_version || '1.5.0' }}
      C001APK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      C001APK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      C001APK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      EXPECTED_CERTIFICATE: ${{ secrets.SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-java@v6.1.0
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install explicit Android SDK packages
        run: sdkmanager 'platforms;android-34' 'platforms;android-35' 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Prepare signing key
        if: inputs.variant != 'debug'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64" && test -n "$EXPECTED_CERTIFICATE"
          test -n "$C001APK_KEYSTORE_PASSWORD" && test -n "$C001APK_KEY_ALIAS" && test -n "$C001APK_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/c001apk-signing.jks"
          chmod 600 "$RUNNER_TEMP/c001apk-signing.jks"
          echo "C001APK_KEYSTORE_PATH=$RUNNER_TEMP/c001apk-signing.jks" >> "$GITHUB_ENV"
      - name: Validate and build
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py'
          bash ./gradlew :app:testDebugUnitTest :media-support:testDebugUnitTest :mojito:testDebugUnitTest :app:lintDebug --max-workers=2
          case "$BUILD_VARIANT" in
            debug) task=:app:assembleDebug; extra=();;
            release) task=:app:assembleRelease; extra=(-PrequireReleaseSigning=true);;
            release-no-r8) task=:app:assembleRelease; extra=(-PrequireReleaseSigning=true -PdisableR8=true);;
            *) exit 1;;
          esac
          bash ./gradlew "$task" "${extra[@]}" -PappVersion="$APP_VERSION" -PupdateRepository="$GITHUB_REPOSITORY" --max-workers=2
      - name: Verify APK identity and signature
        run: |
          set -euo pipefail
          folder=release
          test "$BUILD_VARIANT" != debug || folder=debug
          mkdir -p verified-apk
          for apk in "app/build/outputs/apk/$folder/"*.apk; do
            args=()
            test "$BUILD_VARIANT" = debug || args=(--certificate-sha256 "$EXPECTED_CERTIFICATE")
            python3 tools/verify_apk.py "$apk" "${args[@]}" > "verified-apk/$(basename "$apk").json"
            cp "$apk" verified-apk/
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: c001apk-${{ inputs.variant }}
          path: verified-apk/
          if-no-files-found: error
          overwrite: true
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/c001apk-signing.jks"
