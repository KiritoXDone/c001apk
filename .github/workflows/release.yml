name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry (vMAJOR.MINOR.PATCH)
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Release tags must use vMAJOR.MINOR.PATCH')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={tag[1:]}\n')
              output.write(f'tag={tag}\n')
          PY

  build:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      variant: release
      app_version: ${{ needs.version.outputs.version }}
      source_ref: refs/tags/${{ needs.version.outputs.tag }}
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: c001apk-release
          path: build/release-assets
      - name: Prepare release notes and checksums
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(r'^## ' + re.escape(version) + r'(?:\s[^\n]*)?\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          notes = section[1].strip() if section else f'c001apk {version}'
          notes += '\n\nAndroid 7+ · ARM64；模糊效果需要 Android 13+。\n\n包名：`com.example.c001apk.compose`。\n'
          Path('build/release-notes.md').write_text(notes)
          apks = sorted(Path('build/release-assets').glob('*.apk'))
          if len(apks) != 1:
              raise SystemExit('Expected exactly one verified release APK')
          apk = apks[0]
          report_path = apk.with_name(apk.name + '.json')
          report = json.loads(report_path.read_text())
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          if report['versionName'] != version or report['sha256'] != digest:
              raise SystemExit('APK verification report does not match the release')
          # GitHub rewrites parentheses in uploaded asset names. Normalize first
          # so the report and checksums refer to the actual downloadable filename.
          public_apk = apk.with_name(f'c001apk_{version}.{report["versionCode"]}.apk')
          apk.rename(public_apk)
          report['apk'] = public_apk.name
          public_report = public_apk.with_name(public_apk.name + '.json')
          public_report.write_text(json.dumps(report, indent=2) + '\n')
          if report_path != public_report:
              report_path.unlink()
          Path('build/release-assets/SHA256SUMS').write_text(digest + '  ' + public_apk.name + '\n')
          PY
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(build/release-assets/*.apk build/release-assets/*.json build/release-assets/SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file build/release-notes.md --draft=false
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TAG" --notes-file build/release-notes.md
          fi
